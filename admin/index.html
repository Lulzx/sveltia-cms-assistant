<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>%%TITLE%%</title>
    %%FAVICON%%
    <link rel="stylesheet" href="./panel.css" />
    <!--
      A template: scripts/build.mjs fills in the %% placeholders.

      sveltia-cms.js is served from this origin rather than unpkg, so the
      version is pinned by package.json and the admin keeps working when a
      CDN does not. The build copies it in next to this file.

      The CDN hosts are not optional. Sveltia's @font-face rules point at
      cdn.jsdelivr.net for Material Symbols (every icon in the UI) and its
      text fonts; block them and the toolbar renders the icon names as words.
      unpkg.com is where the markdown editor imports its syntax highlighter
      from, on demand.

      Sign-in talks to api.github.com with a token that the build may bake
      into auth.js, and the assistant talks to openrouter.ai with a key baked
      into settings.js. If either is baked in, this bundle is a secret and
      must only be served behind authentication. The site's own origins are
      added so the assistant can read the published-posts index and the
      editor can show images from the live site.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com;
        style-src 'self' 'unsafe-inline';
        font-src 'self' data: https://cdn.jsdelivr.net;
        img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com%%CSP_IMG%%;
        connect-src 'self' blob: data: https://openrouter.ai https://api.github.com https://raw.githubusercontent.com https://www.githubstatus.com https://cdn.jsdelivr.net https://unpkg.com%%CSP_CONNECT%%;
        manifest-src 'self' blob:;
        worker-src 'self' blob:;
        frame-src 'none';
        form-action 'self';
      "
    />
  </head>
  <body>
    <!-- The CMS boots itself the moment its script loads unless it is told
         not to. It is told not to here so panel.js can register the `seo`
         widget that config.yml uses before any of that config is read. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- auth.js is generated by the build and, when a token was supplied,
         signs the editor in with it; it has to run before the CMS boots. -->
    <script src="./auth.js"></script>
    <script src="./sveltia-cms.js"></script>
    <!-- settings.js is generated too: the site settings from
         assistant.config.mjs, and the OpenRouter key and model if given.
         Without a key the writer and the Fix buttons are off; the analysis
         itself needs no network. -->
    <script src="./settings.js"></script>
    <!-- The assistant, in load order: settings merged over defaults, the
         SEO analysis, the model transport and field helpers, then the panel
         that registers the widget and starts the CMS. -->
    <script src="./config.js"></script>
    <script src="./analysis.js"></script>
    <script src="./ai.js"></script>
    <script src="./panel.js"></script>
    <script>
      // If panel.js never arrived, nothing would call init() and the admin
      // would stay blank. init() is idempotent, so this is a no-op whenever
      // panel.js did its job.
      window.addEventListener("load", function () {
        if (!window.__seoWidgetLoaded && window.CMS) window.CMS.init();
      });
    </script>
  </body>
</html>
